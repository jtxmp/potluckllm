version: 2
updates:
  # pnpm projects use the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release before proposing it, so a compromised
    # version has time to be found and pulled first.
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
